<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shop | P.A.W’s Handcrafted Soaps</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div class="announce">Flat-rate shipping $12 • Local pickup available</div>

  <header class="header">
    <div class="container header__inner">
      <a class="brand" href="index.html">P.A.W’s Handcrafted Soaps</a>
      <nav class="nav">
        <a href="index.html" class="nav__link">Home</a>
        <a href="shop.html" class="nav__link is-active">Shop</a>
        <a href="contact.html" class="nav__link">Contact</a>
        <button class="cart-btn" onclick="toggleCart()">Cart <span id="cartCount" class="cart-count">0</span></button>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="section__head">
        <h2>Shop Soaps</h2>
        <a class="link" href="checkout.html">Checkout →</a>
      </div>

      <div class="grid" id="shopGrid"></div>
    </div>
  </main>

   <!-- Cart drawer -->
  <aside class="cart-drawer" id="cartDrawer" aria-hidden="true">
    <div class="cart-drawer__panel">
      <div class="cart-drawer__head">
        <h3>Your Cart</h3>
        <button class="icon-btn" onclick="toggleCart()" aria-label="Close cart">✕</button>
      </div>

      <div id="cartItems" class="cart-items"></div>

      <div class="cart-totals">
        <div class="row"><span>Subtotal</span><strong id="cartSubtotal">$0.00</strong></div>
        <div class="row micro"><span>Shipping calculated at checkout</span></div>
      </div>

      <div class="cart-actions">
        <a class="btn btn--primary btn--block" href="checkout.html">Go to Checkout</a>
        <a class="btn btn--block" href="shop.html">Continue Shopping</a>
      </div>
    </div>

    <div class="cart-drawer__backdrop" onclick="toggleCart()"></div>
  </aside>

  <script src="assets/js/products.js"></script>
  <script src="assets/js/cart.js"></script>
  <script>
    const grid = document.getElementById("shopGrid");
    const products = window.PAWS_PRODUCTS || [];
    grid.innerHTML = products.map(p => `
      <div class="card">
        <div class="card__img">${p.image ? `<img src="${p.image}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover">` : "Product photo"}</div>
        <div class="card__body">
          <div class="card__title">${p.name}</div>
          <div class="micro">${p.desc || ""}</div>
          <div class="card__price">$${p.price.toFixed(2)}</div>
          <div class="card__actions">
            <button class="btn btn--primary" onclick="addToCart('${p.id}')">Add to cart</button>
            <a class="btn" href="checkout.html">Checkout</a>
          </div>
        </div>
      </div>
    `).join("");
    renderCartUI();
  </script>
</body>
</html>
